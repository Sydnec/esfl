name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : un push qui en suit un autre annule le
# précédent plutôt que de faire la queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lit la version dans "packageManager" du package.json racine.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les services importent generated/client (gitignoré) : generate est un
      # prérequis de tout le reste, typecheck compris. Aucune connexion à la
      # base n'est nécessaire.
      - name: Client Prisma
        run: pnpm -r --if-present prisma:generate

      # @esfl/contracts est consommé via son dist/ : sans ce build, les autres
      # workspaces ne résolvent ni ses types ni ses constantes.
      - name: Contracts
        run: pnpm --filter @esfl/contracts build

      # Étapes rapides d'abord : elles cadrent la majorité des erreurs et
      # rendent la main en quelques secondes, là où le build prend des minutes.
      - name: Format
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      # Distinct du build : `next build` ne typecheck pas les fichiers de test,
      # exclus de son tsconfig parce qu'ils importent vitest. C'est
      # `tsconfig.test.json` qui les couvre, via le script du workspace web.
      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Tests
        run: pnpm -r --if-present test

      # En dernier : le plus lent, et tout ce qui précède l'a déjà largement
      # dégrossi.
      - name: Build
        run: pnpm build
