# Stack de production : infra + les 5 services. L'accès public passe par un
# tunnel Cloudflare (service hôte `cloudflared`) qui route vers le gateway
# publié en loopback ; Cloudflare termine le TLS, donc pas de reverse proxy
# dans le stack. Le frontend (apps/web) est déployé séparément sur Vercel.

# Identité du build, commune aux cinq images : les services sont construits et
# démarrés ensemble par scripts/deploy.sh, donc ils portent le même numéro.
# `deploy.sh` exporte ces deux variables ; les replis servent aux builds à la
# main, où l'image n'a pas d'identité fiable à revendiquer.
x-identite-build: &identite-build
  VERSION: ${ESFL_VERSION:-dev}
  COMMIT: ${ESFL_COMMIT:-local}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: esfl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: esfl
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esfl']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Sauvegarde : dump horaire des données irremplaçables (comptes, ligues,
  # rosters) et dump complet quotidien. Voir scripts/backup.sh et la section
  # « Sauvegarde et restauration » de DEPLOY.md.
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: esfl
      POSTGRES_DB: esfl
      BACKUP_DIR: /backups
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    command: ['sh', '/backup.sh']
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: .
      args:
        <<: *identite-build
        SERVICE: gateway
    # Exposé en loopback uniquement : le tunnel Cloudflare (service hôte
    # cloudflared) l'atteint via http://localhost:4000. Jamais publié sur une
    # interface publique ni sur le LAN — Cloudflare termine le TLS en amont.
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      FRONTEND_URL: ${FRONTEND_URL:?}
      AUTH_SERVICE_URL: http://auth-service:4001
      DATA_SERVICE_URL: http://data-service:4002
      FANTASY_SERVICE_URL: http://fantasy-service:4003
      SCORING_SERVICE_URL: http://scoring-service:4004
    depends_on:
      auth-service: { condition: service_healthy }
      data-service: { condition: service_healthy }
      fantasy-service: { condition: service_healthy }
      scoring-service: { condition: service_healthy }
    # Sonde applicative : `restart: unless-stopped` ne relance qu'un process
    # MORT. Un service qui démarre mais ne répond plus — base injoignable,
    # boucle bloquée — resterait « up » sans elle. `start_period` couvre le
    # `prisma migrate deploy` du démarrage.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  auth-service:
    build:
      context: .
      args:
        <<: *identite-build
        SERVICE: auth-service
    environment:
      PORT: 4001
      AUTH_DATABASE_URL: postgresql://esfl:${POSTGRES_PASSWORD:?}@postgres:5432/esfl?schema=auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      FRONTEND_URL: ${FRONTEND_URL:?}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:?}
      # Suppression de compte : nettoyage des ligues et des notes chez les deux
      # services concernés.
      FANTASY_SERVICE_URL: http://fantasy-service:4003
      SCORING_SERVICE_URL: http://scoring-service:4004
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:4001/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  data-service:
    build:
      context: .
      args:
        <<: *identite-build
        SERVICE: data-service
    environment:
      PORT: 4002
      DATA_DATABASE_URL: postgresql://esfl:${POSTGRES_PASSWORD:?}@postgres:5432/esfl?schema=data
      REDIS_URL: redis://redis:6379
      # Appels internes sortants : transfert des notes après une fusion de
      # fiches joueur (scoring) et ciblage de l'ingestion sur les compétitions
      # réellement suivies (fantasy). Sans ces URL, les clients se replient sur
      # `localhost`, qui dans un conteneur désigne le conteneur lui-même.
      FANTASY_SERVICE_URL: http://fantasy-service:4003
      SCORING_SERVICE_URL: http://scoring-service:4004
      PANDASCORE_TOKEN: ${PANDASCORE_TOKEN:-}
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
      # Optionnels : desserrent nettement le rate limit Leaguepedia (LoL).
      LEAGUEPEDIA_USERNAME: ${LEAGUEPEDIA_USERNAME:-}
      LEAGUEPEDIA_BOT_PASSWORD: ${LEAGUEPEDIA_BOT_PASSWORD:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      HISTORY_BACKFILL_SINCE: ${HISTORY_BACKFILL_SINCE:-2026-01-01}
      STATS_BACKFILL_DAYS: ${STATS_BACKFILL_DAYS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:4002/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  fantasy-service:
    build:
      context: .
      args:
        <<: *identite-build
        SERVICE: fantasy-service
    environment:
      PORT: 4003
      FANTASY_DATABASE_URL: postgresql://esfl:${POSTGRES_PASSWORD:?}@postgres:5432/esfl?schema=fantasy
      DATA_SERVICE_URL: http://data-service:4002
      SCORING_SERVICE_URL: http://scoring-service:4004
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:4003/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  scoring-service:
    build:
      context: .
      args:
        <<: *identite-build
        SERVICE: scoring-service
    environment:
      PORT: 4004
      SCORING_DATABASE_URL: postgresql://esfl:${POSTGRES_PASSWORD:?}@postgres:5432/esfl?schema=scoring
      REDIS_URL: redis://redis:6379
      DATA_SERVICE_URL: http://data-service:4002
      FANTASY_SERVICE_URL: http://fantasy-service:4003
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      SCORING_FREEZE_ENABLED: ${SCORING_FREEZE_ENABLED:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:4004/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
