services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: esfl
      POSTGRES_PASSWORD: esfl
      POSTGRES_DB: esfl
    ports:
      # 5433 côté hôte : le 5432 local est déjà occupé par un autre postgres
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esfl']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
